<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Data - Masuk/Keluar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fa;color:#263238;padding-bottom:50px}
.atas{background:#fff;padding:18px 45px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e5e7eb;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:30px}
.atas h1{color:#1e3a5f;font-size:23px;margin-right:auto;text-transform:capitalize;font-weight:700}
.atas a{color:#4b5563;text-decoration:none;font-weight:600;padding:9px 14px;border-radius:6px;transition:.2s;font-size:14px}
.atas a:hover{background:#f1f5f9;color:#2563eb}
h2{text-align:center;color:#334155;font-size:21px;margin:5px auto 22px;font-weight:700}
.aksi-stok{display:flex;justify-content:center;gap:12px;margin-bottom:25px}
.aksi-stok button{padding:11px 18px!important;border-radius:7px;border:1px solid #d1d5db;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
#btn-stok-masuk{background:#f0fdf4!important;color:#166534;border-color:#bbf7d0!important}
#btn-stok-masuk:hover{background:#dcfce7!important;transform:translateY(-1px)}
#btn-stok-keluar{background:#fff7ed!important;color:#c2410c;border-color:#fed7aa!important}
#btn-stok-keluar:hover{background:#ffedd5!important;transform:translateY(-1px)}
#kotak-transaksi{width:400px!important;max-width:90%;margin:auto;border:none!important;border-radius:12px!important;padding:25px!important;box-shadow:0 15px 40px rgba(0,0,0,.18)}
#kotak-transaksi::backdrop{background:rgba(15,23,42,.35)}
#judul-dialog{color:#1e3a5f;margin-bottom:20px;font-size:20px}
#form-transaksi p{margin-bottom:15px}
#form-transaksi label{font-weight:600;color:#374151;font-size:14px}
#pilih-barang,#input-jumlah{width:100%;margin-top:6px;padding:10px 11px;border:1px solid #d1d5db;border-radius:6px;outline:none;font-size:14px;background:#fff}
#pilih-barang:focus,#input-jumlah:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
#info-barang{background:#f8fafc!important;border:1px solid #e2e8f0;border-radius:7px;padding:12px!important;margin-bottom:15px!important}
#info-barang p{margin-bottom:5px;color:#64748b;font-size:13px}
#info-barang p:last-child{margin-bottom:0}
#info-barang strong{color:#334155}
#btn-batal-t,#btn-simpan-t{padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px}
#btn-batal-t{background:#fff;color:#4b5563;border:1px solid #d1d5db}
#btn-batal-t:hover{background:#f3f4f6}
#btn-simpan-t{background:#2563eb;color:#fff;border:none;margin-left:8px}
#btn-simpan-t:hover{background:#1d4ed8}
.kotak{width:92%;max-width:1200px;margin:auto;background:#fff;padding:20px;border-radius:12px;border:1px solid #e5e7eb;box-shadow:0 4px 15px rgba(0,0,0,.05);overflow-x:auto}
#tabel-mutasi{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden}
#tabel-mutasi th{background:#f1f5f9;color:#374151;padding:13px 12px;text-align:center;text-transform:capitalize;font-size:13px;font-weight:700;border-bottom:1px solid #dbe1e8}
#tabel-mutasi th:first-child{border-radius:7px 0 0 0}
#tabel-mutasi th:last-child{border-radius:0 7px 0 0}
#tabel-mutasi td{padding:13px 12px;border-bottom:1px solid #edf0f2;text-align:center;font-size:14px;color:#374151}
#tabel-mutasi tr:not(:first-child){transition:.15s}
#tabel-mutasi tr:not(:first-child):hover{background:#f8fafc}
#tabel-mutasi td:nth-child(3){font-weight:600}
#tabel-mutasi button{background:#f1f5f9;color:#dc2626;border:1px solid #fecaca;padding:7px 13px;border-radius:5px;cursor:pointer;font-weight:600;transition:.2s;font-size:13px}
#tabel-mutasi button:hover{background:#fee2e2;border-color:#fca5a5}
@media(max-width:700px){
.atas{flex-direction:column;padding:18px 20px;gap:5px}
.atas h1{margin-right:0;margin-bottom:8px;font-size:21px}
.atas a{width:100%;text-align:center}
h2{font-size:18px;padding:0 15px}
.aksi-stok{flex-direction:column;width:90%;margin-left:auto;margin-right:auto}
.aksi-stok button{width:100%}
.kotak{width:96%;padding:10px}
#tabel-mutasi{min-width:800px}
}
</style>
</head>
<body>
<div class="atas">
<h1>Sistem Stock Barang</h1>
<a href="sistemstok.html">Data Barang</a>
<a href="databarangnya.html">Masuk atau Keluar</a>
<a href="dashboard.html">Dashboard</a>
</div>

<h2>Manajemen Transaksi Stok (Masuk / Beli)</h2>

<div class="aksi-stok">
<button id="btn-stok-masuk">+ Barang Masuk</button>
<button id="btn-stok-keluar">- Beli Barang</button>
</div>

<dialog id="kotak-transaksi">
<h3 id="judul-dialog">Transaksi</h3>
<form id="form-transaksi" method="dialog">
<p>
<label>Pilih Barang:</label><br>
<select id="pilih-barang" required>
<option value="">-- Pilih Barang Tersedia --</option>
</select>
</p>
<div id="info-barang" style="display:none">
<p>Harga Satuan: <strong id="info-harga">0</strong></p>
<p>Sisa Stok Sistem: <strong id="info-stok">0</strong></p>
</div>
<p>
<label id="label-jumlah">Jumlah:</label><br>
<input type="number" id="input-jumlah" min="1" required>
</p>
<br>
<button type="button" id="btn-batal-t">Batal</button>
<button type="submit" id="btn-simpan-t">Proses</button>
</form>
</dialog>

<div class="kotak">
<table border="0" id="tabel-mutasi">
<tr>
<th>Tanggal/Waktu</th>
<th>Nama Barang</th>
<th>Jenis Transaksi</th>
<th>Jumlah</th>
<th>Total Harga</th>
<th>Aksi</th>
</tr>
</table>
</div>

<script>
const btnMasuk=document.getElementById('btn-stok-masuk');
const btnKeluar=document.getElementById('btn-stok-keluar');
const kotakTransaksi=document.getElementById('kotak-transaksi');
const formTransaksi=document.getElementById('form-transaksi');
const btnBatalT=document.getElementById('btn-batal-t');
const tabelMutasi=document.getElementById('tabel-mutasi');
const pilihBarang=document.getElementById('pilih-barang');
const divInfo=document.getElementById('info-barang');

let daftarBarang=JSON.parse(localStorage.getItem('daftarBarang'))||[];
let riwayatMutasi=JSON.parse(localStorage.getItem('riwayatMutasi'))||[];
let jenisTransaksi="";

function muatDropdownBarang(){
pilihBarang.innerHTML='<option value="">-- Pilih Barang Tersedia --</option>';
daftarBarang.forEach((barang,index)=>{
pilihBarang.innerHTML+=`<option value="${index}">${barang.nama}</option>`;
});
}

pilihBarang.addEventListener('change',function(){
const indexTerpilih=this.value;
if(indexTerpilih!==""){
const barang=daftarBarang[indexTerpilih];
document.getElementById('info-harga').innerText="Rp "+Number(barang.harga).toLocaleString('id-ID');
document.getElementById('info-stok').innerText=barang.stok;
divInfo.style.display="block";
}else{
divInfo.style.display="none";
}
});

btnMasuk.addEventListener('click',()=>{
jenisTransaksi="Masuk";
document.getElementById('judul-dialog').innerText="Tambah Stok Masuk";
document.getElementById('label-jumlah').innerText="Jumlah Masuk:";
formTransaksi.reset();
muatDropdownBarang();
divInfo.style.display="none";
kotakTransaksi.showModal();
});

btnKeluar.addEventListener('click',()=>{
jenisTransaksi="Beli";
document.getElementById('judul-dialog').innerText="Beli / Kurangi Barang";
document.getElementById('label-jumlah').innerText="Jumlah Beli:";
formTransaksi.reset();
muatDropdownBarang();
divInfo.style.display="none";
kotakTransaksi.showModal();
});

btnBatalT.addEventListener('click',()=>kotakTransaksi.close());

formTransaksi.addEventListener('submit',function(e){
const indexBarang=pilihBarang.value;
const jumlah=Number(document.getElementById('input-jumlah').value);

if(indexBarang===""){
e.preventDefault();
alert("Silakan pilih barang terlebih dahulu.");
return;
}

const barang=daftarBarang[indexBarang];

if(jenisTransaksi==="Beli"&&jumlah>barang.stok){
alert("Transaksi Gagal! Jumlah beli melebihi sisa stok yang ada.");
e.preventDefault();
return;
}

if(jenisTransaksi==="Masuk") barang.stok+=jumlah;
else if(jenisTransaksi==="Beli") barang.stok-=jumlah;

localStorage.setItem('daftarBarang',JSON.stringify(daftarBarang));

const waktu=new Date().toLocaleString('id-ID');
const totalHarga=barang.harga*jumlah;

riwayatMutasi.push({
waktu:waktu,
nama:barang.nama,
jenis:jenisTransaksi,
jumlah:jumlah,
totalHarga:totalHarga
});

localStorage.setItem('riwayatMutasi',JSON.stringify(riwayatMutasi));
tampilkanMutasi();
});

function tampilkanMutasi(){
while(tabelMutasi.rows.length>1) tabelMutasi.deleteRow(1);

riwayatMutasi.forEach((mutasi,index)=>{
let baris=tabelMutasi.insertRow(-1);
baris.insertCell(0).innerText=mutasi.waktu;
baris.insertCell(1).innerText=mutasi.nama;
baris.insertCell(2).innerText=mutasi.jenis;
baris.insertCell(3).innerText=mutasi.jumlah;
baris.insertCell(4).innerText="Rp "+Number(mutasi.totalHarga).toLocaleString('id-ID');
let kolAksi=baris.insertCell(5);
kolAksi.innerHTML=`<button onclick="hapusMutasi(${index})">Hapus Riwayat</button>`;
});
}

function hapusMutasi(index){
riwayatMutasi.splice(index,1);
localStorage.setItem('riwayatMutasi',JSON.stringify(riwayatMutasi));
tampilkanMutasi();
}

tampilkanMutasi();
</script>
</body>
</html>
